name: Build and Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: repo-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push Strapi CMS
        uses: docker/build-push-action@v5
        with:
          context: ./briamco-strapi
          file: ./briamco-strapi/Dockerfile.production
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/briamco-strapi:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/briamco-strapi:${{ github.sha }}
          build-args: |
            PUBLIC_URL=https://subs.sicepot.com
            CLIENT_URL=https://subs.sicepot.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web-briamco
          file: ./web-briamco/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/briamco-frontend:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/briamco-frontend:${{ github.sha }}
          build-args: |
            VITE_STRAPI_URL=https://subs.sicepot.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: "${{ secrets.VPS_SSH_KEY != '' }}"
    steps:
      - name: Execute remote deploy script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '202.155.137.226' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR=""
            if [ -d "/root/briamco" ]; then
              DEPLOY_DIR="/root/briamco"
            elif [ -d "$HOME/briamco" ]; then
              DEPLOY_DIR="$HOME/briamco"
            else
              echo "Error: briamco directory not found on VPS" >&2
              exit 1
            fi
            cd "$DEPLOY_DIR"
            git pull origin main
            ./deploy.sh
