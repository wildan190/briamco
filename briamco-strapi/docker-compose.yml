version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: briamco-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-briamco_db}
      POSTGRES_USER: ${DATABASE_USER:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - briamco-network
    restart: unless-stopped

  # Strapi CMS Service
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: briamco-strapi
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-briamco_db}
      DATABASE_USER: ${DATABASE_USER:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi_password}
      DATABASE_SSL: "false"
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS:-testKey1,testKey2,testKey3,testKey4}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-testKeySalt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-testJWTSecret}
      JWT_SECRET: ${JWT_SECRET:-testJWTSecret}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-testTransferTokenSalt}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./config:/app/config
      - ./src:/app/src
      - ./public:/app/public
    ports:
      - "1337:1337"
    networks:
      - briamco-network
    restart: unless-stopped
    # Override command for development mode with hot reload
    command: npm run develop

volumes:
  postgres_data:
    driver: local

networks:
  briamco-network:
    driver: bridge
